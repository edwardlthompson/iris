<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Iris</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --fg: #e8eaef;
        --muted: #9aa3b2;
        --accent: #5b8cff;
        --ok: #1a7f37;
        --err: #cf222e;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #1e2a44, var(--bg));
        color: var(--fg);
        min-height: 100dvh;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0.75rem 0 0.35rem;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem 0.85rem;
        border-radius: 0.55rem;
        border: 1px solid #2a3140;
        background: #0e1117;
        color: var(--fg);
        font-size: 1rem;
      }
      #code {
        letter-spacing: 0.2em;
        text-align: center;
        font-size: 1.25rem;
      }
      button {
        margin-top: 0.85rem;
        width: 100%;
        padding: 0.85rem;
        border: 0;
        border-radius: 0.55rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.secondary {
        background: #2a3140;
      }
      #status {
        margin-top: 0.85rem;
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.err {
        color: var(--err);
      }
      #remote {
        display: none;
      }
      #remote.active {
        display: block;
      }
      #pair-panel.hidden {
        display: none;
      }
      #legs {
        margin: 0.75rem 0;
        padding: 0.75rem;
        border-radius: 0.55rem;
        background: #0e1117;
        border: 1px solid #2a3140;
        font-size: 0.85rem;
      }
      #log {
        white-space: pre-wrap;
        font-size: 0.85rem;
        color: var(--muted);
        max-height: 12rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Iris</h1>
      <p class="lede">Routes to the best leg you still have credits for.</p>

      <section id="pair-panel">
        <form id="pair-form">
          <label for="code">Host pairing code</label>
          <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
          <label for="host">Host WebSocket</label>
          <input id="host" name="host" placeholder="ws://127.0.0.1:7842" />
          <button type="submit">Pair</button>
        </form>
      </section>

      <section id="remote">
        <div id="legs">Not paired</div>
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="4" placeholder="Ask the host…"></textarea>
        <button id="send" type="button">Send via best available leg</button>
        <button id="refresh" class="secondary" type="button">Refresh legs</button>
        <button id="unpair" class="secondary" type="button">Disconnect</button>
        <pre id="log"></pre>
      </section>

      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
