name: Benchmarks refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh CursorBench table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
      - name: Refresh benchmarks
        id: refresh
        run: |
          set +e
          OUT="$(node scripts/refresh-benchmarks.mjs)"
          CODE=$?
          echo "$OUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open needs-review PR when guardrails fail
        if: hashFiles('docs/BENCHMARKS.needs-review.md') != ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(benchmarks): needs review after refresh guardrail"
          title: "chore(benchmarks): needs review"
          body: |
            Automated CursorBench refresh hit Appendix D guardrails.
            Review `docs/BENCHMARKS.needs-review.md` before promoting to `docs/BENCHMARKS.md`.
          branch: chore/benchmarks-needs-review
          labels: needs-review
      - name: Open update PR when table changed
        if: hashFiles('docs/BENCHMARKS.needs-review.md') == ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(benchmarks): refresh CursorBench table"
          title: "chore(benchmarks): refresh CursorBench"
          body: |
            Weekly Appendix D refresh of `docs/BENCHMARKS.md` with fresh provenance.
          branch: chore/benchmarks-refresh
